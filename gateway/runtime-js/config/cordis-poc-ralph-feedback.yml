# YXSpec SQT 网关 — POC 副本：tool-ralph + feedback + schedule 可达性验证
# 基于 cordis-baseline-20260825.yml（无 weknora/graph-memory/yxspec），追加候选能力。
# 注意：本文件为验证副本，端口/服务与主 8787 无关；勿用于生产。
# 插件用裸包名，从本文件所在目录的 node_modules 向上解析（junction 指向 harness 仓库）。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# pi-ai 多 provider 适配器：dormant 挂载，凭 settings.yaml 的 llm-pi-ai 节激活 minimax-cn
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

# 用户 settings 文档（$DSH_HOME/settings.yaml），热重载；llm-pi-ai 节由此进入
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# 凭据来源：环境变量（MINIMAX_CN_API_KEY） > .credentials.yaml
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# agent 主脊：无 UI、无 executor 的默认组合（goal / todo / skills / loop / bash）
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: true
      filesystem:
        dshHome: !!js process.env.DSH_HOME ?? 'C:/Users/Administrator/.dsh'
    toolBash:
      enableRunInBackground: false
    toolJobs: false
    goals:
      domain: {}
      tool: {}

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: 'none'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# ===================== POC 候选能力装配 =====================
# ---- ralph 栈：workflowEngine (worker-thread) + subagents(spawn) + tool-workflow + tool-ralph ----
# 参考 examples/headless-agent/cordis.yml 官方装配。

# Projection registry：durable subagent 身份折叠；subagent catalog 依赖。
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# 新鲜子 agent：spawn（独立进程 in-process backend）
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

# 可续后台子 agent 控制工具（可选，ralph 不依赖但属完整 subagent 栈）
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

# workflow 引擎 + 模型工具 + 固定 Ralph 工具
- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'

# ---- feedback 栈 ----
# command-feedback：/feedback 人侧捕获（依赖 ctx.commands）。headless/JSON-RPC 无 command adapter，
# 但 recordFeedback(session, text) 事件写路径可独立使用；装配验证其插件可解析即可。
- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: command-feedback
  name: '@deepseek-ai/dsh-command-feedback'

# message-feedback：per-message 打分/备注 sidecar（依赖 storageDomain + sessionPersistence + sessions）
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js process.env.DSH_STORAGE_ROOT ?? './.storage'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: message-feedback
  name: '@deepseek-ai/dsh-message-feedback'
  config:
    maxNoteBytes: 8192

# ---- schedule 栈 ----
# Session 本地定时器；依赖 agents/sessions/tools/sessionPersistence（均已在组合中）。
# 注意：插件只在它装载后创建的 root Agent 上安装工具（load-order boundary）。
- id: schedule
  name: '@deepseek-ai/dsh-schedule'
